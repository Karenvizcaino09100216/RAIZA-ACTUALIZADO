<style id="rz-diseno">
/* ===== Diseño del panel anterior: paneles planos, tablas y etiquetas (sin sombras ni emojis) ===== */
.db-content .panel,.tarjeta-modulo-item,.tarjeta-ajustes,.tarjeta-curso,.tarjeta-panel-dashboard{background:#fff;border:1px solid var(--db-line);border-radius:12px;box-shadow:none;}
.tarjeta-curso{padding:20px;gap:10px;transition:none;}
.tarjeta-curso:hover{transform:none;box-shadow:none;border-color:var(--db-line);}
.tarjeta-icono{width:44px;height:44px;border-radius:10px;font-size:1.35rem;background:var(--db-olive-100);color:var(--db-olive-ink);}
.tarjeta-curso h3{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--db-heading);}
.tarjeta-modulo-item{padding:18px;gap:12px;}
.tarjeta-modulo-item .modulo-item-titulo,.tarjeta-ajustes h3{font-family:'Fraunces',serif;color:var(--db-heading);}
.nivel-badge,.badge-pendiente,.badge-entregada,.badge-info,.badge-proximamente,.estado-en-camino,.estado-pendiente,.estado-pagado,.estado-entregado,.estado-rechazado{border-radius:6px;padding:3px 10px;font-size:.75rem;font-weight:600;letter-spacing:0;}
.nivel-badge,.badge-proximamente{background:var(--db-gold-100);color:var(--db-gold-ink);}
.kit-precio{color:var(--db-heading);font-size:1.2rem;}
.kit-footer-card{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;}
.btn-comprar-kit{background:var(--coral-500);}
.btn-comprar-kit:hover{background:var(--coral-600);}
.catalogo-grid{margin-top:0;gap:16px;}
.titulo-nivel-tarea{font-family:'Fraunces',serif;font-size:1.02rem;border-left:0;padding:0 0 8px;margin:26px 0 14px;border-bottom:1px solid var(--db-line);color:var(--db-heading);}
.tabs-niveles{background:var(--db-gray-50);border:1px solid var(--db-line);}
.btn-nivel.activo-nivel{box-shadow:none;border:1px solid var(--db-line);}
.aviso-integracion-box{border:1px solid var(--db-line);background:#fff;border-radius:12px;padding:34px 24px;margin-top:0;}
.aviso-icono{width:48px;height:48px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--db-olive-100);color:var(--db-olive-ink);}
.aviso-titulo{font-family:'Fraunces',serif;color:var(--db-heading);}
.video-no-disponible span{display:flex;justify-content:center;font-size:1.8rem;}
.comentario-caja{background:var(--db-gray-50);border-left:0;border:1px solid var(--db-line);border-radius:10px;}
.lista-dashboard{gap:0;}
.lista-dashboard li{background:none;border:0;border-bottom:1px solid var(--db-line);border-radius:0;padding:11px 2px;border-left:0 !important;}
.lista-dashboard li:last-child{border-bottom:0;}
.lista-dashboard .item-vacio{color:var(--db-gray-500);font-size:.88rem;}
.item-alerta{color:var(--db-coral-ink);}
.db-panel form label{display:block;margin:14px 0 5px;font-size:.78rem;font-weight:600;color:var(--db-gray-700);}
.db-panel form label:first-of-type{margin-top:0;}
.db-panel > h3{margin-bottom:16px;}
.contenedor{gap:18px;}
.accesos{display:flex;flex-direction:column;gap:10px;}
.accesos .btn{width:100%;text-align:center;text-decoration:none;}
.meta-fila{font-size:.8rem;color:var(--db-gray-700);margin-bottom:2px;}
.meta-fila.suave{color:var(--db-gray-500);}
.db-table select{width:auto;padding:6px 8px;border:1px solid var(--db-line);border-radius:8px;font-size:.82rem;background:#fff;}
table.db-table td[title]{max-width:260px;}
table.db-table td.col-acciones{max-width:none;overflow:visible;}
.db-stat-icon .ic{width:1em;height:1em;}
.aviso-icono .ic,.tarjeta-icono .ic{width:1em;height:1em;}
.modal-cerrar{display:flex;align-items:center;justify-content:center;}

/* ===== Barra lateral: color según la paleta RAIZA (regla 60-30-10) =====
   60% base  : verde oliva profundo (degradado monocromático, mismo matiz, solo cambia la luminosidad)
   30% apoyo : arena y verde claro (neutros análogos al oliva) para texto, títulos e iconos
   10% acento: coral (opuesto cálido al verde) SOLO para lo activo, para que destaque */
.db-sidebar{--sb-sand:247,244,230;--sb-olive:195,205,151;background:linear-gradient(180deg,#4c5433 0%,#363c26 100%);padding:18px 12px;gap:2px;scrollbar-width:thin;scrollbar-color:rgba(195,205,151,.28) transparent;}
.db-sidebar::-webkit-scrollbar-thumb{background:rgba(195,205,151,.28);}
.db-brand{gap:12px;padding:4px 6px 18px;margin-bottom:6px;border-bottom:1px solid rgba(var(--sb-olive),.16);}
.db-brand img{filter:none;box-sizing:border-box;width:42px;height:42px;padding:7px;border-radius:12px;background:#f7f4e6;opacity:1;}
.db-brand strong{color:#f7f4e6;font-size:1.08rem;letter-spacing:.04em;}
/* Cada grupo del menú es una tarjeta con su propio fondo */
.db-nav-group{margin-top:10px;padding:10px 8px 8px;background:rgba(var(--sb-sand),.055);border:1px solid rgba(var(--sb-olive),.13);border-radius:14px;}
.db-nav-group--solo{padding:8px;}
.db-nav-group-title{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:rgb(var(--sb-olive));opacity:1;padding:0 8px 8px;}
/* Mismo tamaño de letra e iconos en todos los botones */
.db-nav-item,.db-nav-item.sidebar-btn{font:500 .875rem/1.25 'Inter',sans-serif;padding:7px 10px;border-radius:10px;gap:12px;color:rgba(var(--sb-sand),.78);transition:background .18s,color .18s,transform .18s;}
.db-nav-item .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;opacity:1;background:rgba(var(--sb-olive),.12);color:rgb(var(--sb-olive));transition:background .18s,color .18s;}
.db-nav-item .ico .ic{width:1em;height:1em;}
.db-nav-item:hover{background:rgba(var(--sb-sand),.08);color:rgb(var(--sb-sand));transform:translateX(2px);}
.db-nav-item:hover .ico{background:rgba(var(--sb-olive),.22);color:#f7f4e6;}
.db-nav-item:focus-visible{outline:2px solid #e08f6f;outline-offset:2px;}
/* Activo: único lugar con el acento coral (barra + icono) sobre un fondo arena translúcido */
.db-nav-item.active,.db-nav-item.activo{background:rgba(var(--sb-sand),.1);color:#f7f4e6;font-weight:600;box-shadow:none;transform:none;}
.db-nav-item.active::before,.db-nav-item.activo::before{display:block;content:"";position:absolute;left:-9px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#e08f6f;}
.db-nav-item.active .ico,.db-nav-item.activo .ico{background:#c05f42;color:#fff;opacity:1;}
.db-sidebar-foot{margin:auto 2px 0;padding:14px;border:1px solid rgba(var(--sb-olive),.16);border-radius:12px;background:rgba(var(--sb-sand),.05);font-size:.78rem;color:rgb(var(--sb-olive));}

/* ===== Grupos del menú plegables (clic en el título: Aprendizaje, Mi cuenta, Clases…) ===== */
button.db-nav-group-title{display:flex;align-items:center;justify-content:space-between;width:calc(100% + 0px);background:none;border:0;cursor:pointer;text-align:left;font-family:inherit;border-radius:8px;transition:color .18s,background .18s;}
button.db-nav-group-title:hover{color:#f7f4e6;background:rgba(var(--sb-sand),.06);}
button.db-nav-group-title:focus-visible{outline:2px solid #e08f6f;outline-offset:2px;}
.db-nav-group-title .db-chev{display:inline-flex;font-size:.95rem;transition:transform .2s ease;}
.db-nav-group.cerrado .db-nav-group-title{padding-bottom:2px;}
.db-nav-group.cerrado .db-chev{transform:rotate(-90deg);}
.db-nav-items[hidden]{display:none;}
.db-nav-items{animation:dbAbrir .2s ease;}
@keyframes dbAbrir{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

/* ===== Menú contraíble (escritorio): queda solo la barra de iconos ===== */
.db-sidebar{transition:width .25s ease,padding .25s ease;}
@media (min-width:901px){
  .db-menu-toggle{display:inline-flex;}
  body.sb-colapsado .db-sidebar{width:84px;padding-left:10px;padding-right:10px;}
  body.sb-colapsado .db-brand{justify-content:center;padding:4px 0 16px;}
  body.sb-colapsado .db-brand > span{display:none;}
  body.sb-colapsado .db-nav-group{padding:8px 6px;}
  body.sb-colapsado .db-nav-group-title{display:none;}
  body.sb-colapsado .db-nav-items[hidden]{display:block;}
  body.sb-colapsado .db-nav-item,body.sb-colapsado .db-nav-item.sidebar-btn{font-size:0;gap:0;justify-content:center;padding:6px 0;}
  body.sb-colapsado .db-nav-item:hover{transform:none;}
  body.sb-colapsado .db-nav-item.active::before,body.sb-colapsado .db-nav-item.activo::before{left:-7px;}
  body.sb-colapsado .db-sidebar-foot{display:none;}
}
</style>

</head>

    <div class="db-stat-card"><div class="db-stat-icon ic-red" data-ic="shield-check"></div><div><div class="db-stat-label">Administradores</div><div class="db-stat-value" id="statAdmins">—</div></div></div>
  </div>
</div>

<!-- GESTIÓN DE USUARIOS -->
<div id="usuarios" class="seccion-dashboard">
  <div class="db-content-title"><h1>Gestión de usuarios</h1><p>Registra cuentas, asigna roles y administra su estado.</p></div>
  <div class="contenedor">
    <div class="db-panel">
      <h3 id="tituloFormulario">Registrar Usuario</h3>
      <form id="formRegistro">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required>
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required autocomplete="new-password">
        <label for="rol">Rol</label>
        <select id="rol">
          <option value="Estudiante">Estudiante</option>
          <option value="Instructor">Instructor</option>
          <option value="Administrador">Administrador</option>
        </select>
        <button type="submit" id="btnGuardar" class="btn btn-coral" style="margin-top:18px;width:100%;">Guardar usuario</button>
        <button type="button" id="btnCancelar" class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;display:none;">Cancelar edición</button>
      </form>
    </div>
    <div class="db-panel">
      <div class="db-panel-head"><h3>Lista de usuarios</h3><button id="btnCargar" class="btn btn-outline btn-sm">Actualizar</button></div>
      <div class="db-tabla-scroll">
        <table id="tablaUsuarios" class="db-table">
          <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

    </div>

      <table class="db-table">
        <thead id="cabecera-tabla"></thead>
        <tbody id="cuerpo-tabla"><tr><td class="cargando">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</section>
<!-- CALENDARIO A PANTALLA COMPLETA -->
<section class="db-seccion" id="seccion-calendario-full" style="display:none;">
  <div class="db-content-title"><h1>Calendario</h1><p>Tus clases en vivo y entregas programadas</p></div>
  <div class="db-panel" style="max-width:420px;"><div id="miniCalendarioFull"></div></div>
</section>
</div>
<div data-parte="modal">
<div class="modal-fondo" id="modal-fondo">
  <div class="modal-caja">
    <h3 id="modal-titulo">Registro</h3>
    <p class="modal-sub" id="modal-sub"></p>
    <form id="modal-form"></form>
    <p class="modal-error" id="modal-error"></p>
    <div class="modal-acciones">
      <button type="button" class="btn btn-outline" id="modal-cancelar">Cancelar</button>
      <button type="button" class="btn btn-coral" id="modal-guardar">Guardar</button>
    </div>
  </div>
</div>
</div>
</template>

<script src="icons.js"></script>
<script src="proximamente.js"></script>
<script src="sesion.js"></script>
<script>
/* Decide el panel según el rol guardado al iniciar sesión y carga solo su script. */
(function(){
  var token = localStorage.getItem('raiza_jwt');
  var crudo = (RZ_SESION.rol() || '').toLowerCase();
  var rol = crudo.indexOf('estudiante') !== -1 ? 'estudiante'
          : crudo.indexOf('instructor') !== -1 ? 'instructor'
          : crudo.indexOf('admin') !== -1 ? 'admin' : null;
  if(!token || !rol){ window.location.replace('login.html'); return; }

  var tpl = document.getElementById('tpl-' + rol).content;
  var parte = function(n){ return tpl.querySelector('[data-parte="' + n + '"]'); };
  var comun = document.getElementById('tpl-modulos').content;
  document.getElementById('brandTexto').outerHTML = parte('brand').innerHTML;
  document.getElementById('navRol').innerHTML = parte('nav').innerHTML;
  document.getElementById('footRol').textContent = parte('foot').textContent;
  document.getElementById('contenidoRol').innerHTML = parte('main').innerHTML +
    comun.querySelector('[data-parte="secciones"]').innerHTML;
  document.getElementById('modalesRol').innerHTML = parte('modals').innerHTML +
    comun.querySelector('[data-parte="modal"]').innerHTML;
  document.title = 'RAIZA — ' + parte('brand').textContent.replace('RAIZA','').trim();

  var nombre = RZ_SESION.nombre() || 'Usuario';
  document.getElementById('topbarNombre').textContent = nombre;
  var hn = document.getElementById('heroNombre'); if(hn) hn.textContent = nombre;
  document.getElementById('topbarRol').textContent = rol.charAt(0).toUpperCase() + rol.slice(1);
  var ini = nombre.trim().split(/\s+/).slice(0,2).map(function(p){ return p.charAt(0).toUpperCase(); }).join('') || '?';
  var av = document.getElementById('imgPerfilSidebar');
  if(!av.getAttribute('src')) av.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' rx='32' fill='%236b7a3a'/><text x='32' y='41' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='600' text-anchor='middle' fill='white'>" + ini + "</text></svg>";

  var cerrar = { admin:'cerrarSesionAdmin', instructor:'cerrarSesionInstructor', estudiante:'cerrarSesion' }[rol];
  document.getElementById('logoutBtn').addEventListener('click', function(e){
    e.preventDefault();
    if(typeof window[cerrar] === 'function') window[cerrar](); else { localStorage.clear(); window.location.href = 'login.html'; }
  });
  /* Logo/título de la barra lateral: lleva al inicio del portal del usuario (estudiante, instructor o administrador según su rol) */
  (function(){
    var marca = document.getElementById('brandPortal');
    if(!marca) return;
    marca.addEventListener('click', function(e){
      var inicio = document.querySelector('#navRol .db-nav-item');
      if(!inicio) return;            // sin menú cargado: sigue el enlace normal a portal.html
      e.preventDefault();
      inicio.click();                // misma acción que pulsar "Inicio"
      document.getElementById('sidebar').classList.remove('abierto');
      window.scrollTo(0, 0);
    });
  })();
  /* Grupos plegables: al hacer clic en el título (Aprendizaje, Mi cuenta…) se contraen/expanden; se recuerda el estado por grupo */
  (function(){
    var LLAVE_G = 'raiza_sb_grupos_cerrados';
    var cerrados = [];
    try{ cerrados = JSON.parse(localStorage.getItem(LLAVE_G) || '[]'); }catch(e){}
    function guardar(){ try{ localStorage.setItem(LLAVE_G, JSON.stringify(cerrados)); }catch(e){} }
    document.querySelectorAll('#navRol .db-nav-group').forEach(function(grupo, i){
      var titulo = grupo.querySelector('.db-nav-group-title');
      if(!titulo) return;
      var nombre = titulo.textContent.trim();
      var id = 'grp-' + i;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'db-nav-group-title';
      btn.innerHTML = '<span></span><span class="db-chev" data-ic="chevron-down"></span>';
      btn.firstChild.textContent = nombre;
      var cont = document.createElement('div');
      cont.className = 'db-nav-items';
      cont.id = id;
      while(titulo.nextSibling) cont.appendChild(titulo.nextSibling);
      grupo.replaceChild(btn, titulo);
      grupo.appendChild(cont);
      btn.setAttribute('aria-controls', id);
      function poner(cerrado){
        grupo.classList.toggle('cerrado', cerrado);
        cont.hidden = cerrado;
        btn.setAttribute('aria-expanded', String(!cerrado));
      }
      poner(cerrados.indexOf(nombre) !== -1 && !cont.querySelector('.activo, .active'));
      btn.addEventListener('click', function(){
        var cerrar = !grupo.classList.contains('cerrado');
        poner(cerrar);
        var k = cerrados.indexOf(nombre);
        if(cerrar && k === -1) cerrados.push(nombre);
        if(!cerrar && k !== -1) cerrados.splice(k, 1);
        guardar();
      });
    });
  })();
  /* Menú lateral: en escritorio se contrae a una barra de iconos (se recuerda la elección); en móvil se abre y cierra */
  (function(){
    var LLAVE = 'raiza_sb_colapsado';
    var cuerpo = document.body, boton = document.getElementById('menuToggle');
    var movil = window.matchMedia('(max-width: 900px)');
    document.querySelectorAll('#navRol .db-nav-item').forEach(function(b){
      var txt = b.textContent.trim(); b.title = txt; b.setAttribute('aria-label', txt);
    });
    function etiqueta(){
      var c = cuerpo.classList.contains('sb-colapsado');
      var t = movil.matches ? 'Abrir menú' : (c ? 'Expandir menú' : 'Contraer menú');
      boton.title = t; boton.setAttribute('aria-label', t); boton.setAttribute('aria-expanded', String(!c));
    }
    try{ if(localStorage.getItem(LLAVE) === '1') cuerpo.classList.add('sb-colapsado'); }catch(e){}
    boton.addEventListener('click', function(){
      if(movil.matches){ document.getElementById('sidebar').classList.toggle('abierto'); return; }
      var c = cuerpo.classList.toggle('sb-colapsado');
      try{ localStorage.setItem(LLAVE, c ? '1' : '0'); }catch(e){}
      etiqueta();
    });
    if(movil.addEventListener) movil.addEventListener('change', etiqueta);
    etiqueta();
  })();
  if(window.RZ) RZ.pintar();

  /* =====================================================================
     MÓDULOS (tablas): vista genérica con listar / crear / editar / eliminar
     contra https://localhost:7248/api/<Módulo>, usando el JWT de la sesión.
     ===================================================================== */
  var TABLAS = {"admin": [{"endpoint": "Administrador", "label": "Administradores"}, {"endpoint": "Instructor", "label": "Instructores"}, {"endpoint": "Estudiante", "label": "Estudiantes"}, {"endpoint": "Tematica", "label": "Temáticas"}, {"endpoint": "Modulo", "label": "Módulos"}, {"endpoint": "Leccion", "label": "Lecciones"}, {"endpoint": "Tarea", "label": "Tareas"}, {"endpoint": "EntregaTarea", "label": "Entregas de tareas"}, {"endpoint": "Progreso", "label": "Progreso por módulo"}, {"endpoint": "ProgresoLeccion", "label": "Progreso por lección"}, {"endpoint": "ClasesEnVivo", "label": "Clases en vivo"}, {"endpoint": "ClaseParticipante", "label": "Participantes de clase", "claves": ["idclase", "idestudiante"]}, {"endpoint": "ClassKit", "label": "Kits de clase"}, {"endpoint": "Compra", "label": "Compras"}, {"endpoint": "Certificado", "label": "Certificados"}, {"endpoint": "Notificacion", "label": "Notificaciones"}], "instructor": [{"endpoint": "Tematica", "label": "Temáticas"}, {"endpoint": "Modulo", "label": "Mis módulos"}, {"endpoint": "Leccion", "label": "Lecciones"}, {"endpoint": "Tarea", "label": "Tareas"}, {"endpoint": "Progreso", "label": "Progreso por módulo"}, {"endpoint": "ProgresoLeccion", "label": "Progreso por lección"}, {"endpoint": "ClasesEnVivo", "label": "Clases en vivo"}, {"endpoint": "ClaseParticipante", "label": "Participantes de clase", "claves": ["idclase", "idestudiante"]}, {"endpoint": "Certificado", "label": "Certificados"}, {"endpoint": "Notificacion", "label": "Notificaciones"}], "estudiante": [{"endpoint": "Progreso", "label": "Mi progreso"}, {"endpoint": "ProgresoLeccion", "label": "Progreso por lección"}, {"endpoint": "ClasesEnVivo", "label": "Clases en vivo"}, {"endpoint": "Notificacion", "label": "Notificaciones"}]}[rol];
  var SOLO_LECTURA = (rol === 'estudiante');
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
  var base = function(){ return (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : 'https://localhost:7248/api'; };
  var SENSIBLE = /contrasen|password|hash/i;
  var ES_FECHA = /^\d{4}-\d{2}-\d{2}T/;
  var est = { ep:null, cfg:null, filas:[], cols:[], idKey:null, editando:null };

  async function api(metodo, ruta, cuerpo){
    var r = await fetch(base() + ruta, {
      method: metodo,
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('raiza_jwt'), 'Content-Type': 'application/json' },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined
    });
    if(r.status === 401){ alert('Tu sesión expiró. Inicia sesión nuevamente.'); localStorage.clear(); window.location.href = 'login.html'; throw new Error('Sesión expirada'); }
    var data = null; try{ data = await r.json(); }catch(e){}
    if(!r.ok){
      var msg = data && (data.mensaje || data.message || data.title);
      throw new Error((msg || 'Error del servidor') + ' (código ' + r.status + ')');
    }
    return data;
  }

  function detectarId(ep, fila){
    var claves = Object.keys(fila), obj = 'id' + ep.toLowerCase();
    var norm = function(k){ return k.replace(/_/g,'').toLowerCase(); };
    for(var i=0;i<claves.length;i++) if(norm(claves[i]) === obj) return claves[i];
    for(i=0;i<claves.length;i++) if(claves[i].toLowerCase() === 'id') return claves[i];
    for(i=0;i<claves.length;i++) if(/^id/i.test(claves[i])) return claves[i];
    return null;
  }
  function etiqueta(k){ return k.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2'); }
  function formato(v){
    if(v === null || v === undefined || v === '') return '—';
    if(typeof v === 'boolean') return v ? 'Sí' : 'No';
    if(typeof v === 'string' && ES_FECHA.test(v)){ var d = new Date(v); if(!isNaN(d)) return d.toLocaleString('es-CO'); }
    if(typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function puedeEditar(){ return !SOLO_LECTURA && est.idKey && !(est.cfg && est.cfg.claves); }

  function pintarTabla(){
    var cab = $('cabecera-tabla'), cuerpo = $('cuerpo-tabla');
    if(!est.filas.length){
      cab.innerHTML = '';
      cuerpo.innerHTML = '<tr><td class="vacio">No hay registros en este módulo todavía.</td></tr>';
      return;
    }
    est.cols = Object.keys(est.filas[0]).filter(function(k){ return !SENSIBLE.test(k); });
    var conAcc = puedeEditar();
    cab.innerHTML = '<tr>' + est.cols.map(function(k){ return '<th>' + esc(etiqueta(k)) + '</th>'; }).join('') + (conAcc ? '<th>Acciones</th>' : '') + '</tr>';
    cuerpo.innerHTML = est.filas.map(function(f, i){
      return '<tr>' + est.cols.map(function(k){ return '<td title="' + esc(formato(f[k])) + '">' + esc(formato(f[k])) + '</td>'; }).join('') +
        (conAcc ? '<td class="col-acciones"><button class="accion-link" data-acc="editar" data-i="' + i + '">Editar</button><button class="accion-link borrar" data-acc="eliminar" data-i="' + i + '">Eliminar</button></td>' : '') + '</tr>';
    }).join('');
  }

  async function cargarTabla(ep){
    est.ep = ep; est.cfg = TABLAS.filter(function(t){ return t.endpoint === ep; })[0] || null;
    $('cuerpo-tabla').innerHTML = '<tr><td class="cargando">Cargando…</td></tr>';
    $('cabecera-tabla').innerHTML = '';
    try{
      var datos = await api('GET', '/' + ep);
      est.filas = Array.isArray(datos) ? datos : (datos ? [datos] : []);
      est.idKey = est.filas.length ? detectarId(ep, est.filas[0]) : null;
      pintarTabla();
    }catch(err){
      est.filas = [];
      $('cuerpo-tabla').innerHTML = '<tr><td class="error-tabla">No se pudo cargar: ' + esc(err.message) + '</td></tr>';
    }
  }

  /* ---------- Modal crear / editar ---------- */
  function abrirModal(fila){
    if(!est.filas.length && !fila){ alert('Este módulo aún no tiene registros de ejemplo, así que no se conocen sus campos. Crea el primer registro desde la API o Swagger.'); return; }
    est.editando = fila || null;
    var muestra = fila || est.filas[0];
    $('modal-titulo').textContent = (fila ? 'Editar ' : 'Nuevo registro · ') + (est.cfg ? est.cfg.label : est.ep);
    $('modal-sub').textContent = fila ? 'Modifica los campos y guarda los cambios.' : 'Completa los campos del nuevo registro.';
    $('modal-error').textContent = '';
    $('modal-form').innerHTML = Object.keys(muestra).filter(function(k){ return !SENSIBLE.test(k) && !(k === est.idKey && !fila); }).map(function(k){
      var ref = muestra[k], v = fila ? fila[k] : null, id = 'campo_' + k, ro = (k === est.idKey) ? ' readonly' : '';
      if(typeof ref === 'boolean')
        return '<div class="campo-check"><input type="checkbox" id="' + id + '" data-k="' + esc(k) + '" data-t="bool"' + (v ? ' checked' : '') + '><label for="' + id + '">' + esc(etiqueta(k)) + '</label></div>';
      var tipo = 'text', val = v == null ? '' : v, t = 'text';
      if(typeof ref === 'number'){ tipo = 'number'; t = 'num'; }
      else if(typeof ref === 'string' && ES_FECHA.test(ref)){ tipo = 'datetime-local'; t = 'fecha'; if(v){ var d = new Date(v); val = isNaN(d) ? '' : new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16); } }
      return '<div class="campo"><label for="' + id + '">' + esc(etiqueta(k)) + '</label><input type="' + tipo + '" step="any" id="' + id + '" data-k="' + esc(k) + '" data-t="' + t + '" data-nulo="' + (ref === null ? '1' : '') + '" value="' + esc(val) + '"' + ro + '></div>';
    }).join('');
    $('modal-fondo').classList.add('activo');
  }
  function cerrarModal(){ $('modal-fondo').classList.remove('activo'); }

  async function guardar(){
    var cuerpo = Object.assign({}, est.editando || {});
    $('modal-form').querySelectorAll('[data-k]').forEach(function(el){
      var k = el.dataset.k, t = el.dataset.t;
      if(t === 'bool') cuerpo[k] = el.checked;
      else if(t === 'num') cuerpo[k] = el.value === '' ? null : Number(el.value);
      else if(t === 'fecha') cuerpo[k] = el.value ? new Date(el.value).toISOString() : null;
      else cuerpo[k] = (el.value === '' && el.dataset.nulo) ? null : el.value;
    });
    var btn = $('modal-guardar'); btn.disabled = true; $('modal-error').textContent = '';
    try{
      if(est.editando) await api('PUT', '/' + est.ep + '/' + encodeURIComponent(est.editando[est.idKey]), cuerpo);
      else await api('POST', '/' + est.ep, cuerpo);
      cerrarModal();
      cargarTabla(est.ep);
    }catch(err){ $('modal-error').textContent = err.message; }
    finally{ btn.disabled = false; }
  }
  async function eliminar(fila){
    if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
    try{ await api('DELETE', '/' + est.ep + '/' + encodeURIComponent(fila[est.idKey])); cargarTabla(est.ep); }
    catch(err){ alert('No se pudo eliminar: ' + err.message); }
  }

  $('modal-cancelar').addEventListener('click', cerrarModal);
  $('modal-guardar').addEventListener('click', guardar);
  $('modal-fondo').addEventListener('click', function(e){ if(e.target === this) cerrarModal(); });
  $('btn-refrescar').addEventListener('click', function(){ if(est.ep) cargarTabla(est.ep); });
  $('btn-nuevo').addEventListener('click', function(){ abrirModal(null); });
  if(SOLO_LECTURA) $('btn-nuevo').style.display = 'none';
  $('cuerpo-tabla').addEventListener('click', function(e){
    var b = e.target.closest('[data-acc]'); if(!b) return;
    var fila = est.filas[Number(b.dataset.i)];
    if(b.dataset.acc === 'editar') abrirModal(fila); else eliminar(fila);
  });
  var sel = $('select-tabla');
  sel.innerHTML = TABLAS.map(function(t){ return '<option value="' + t.endpoint + '">' + esc(t.label) + '</option>'; }).join('');
  sel.addEventListener('change', function(){
    var b = document.querySelector('#navRol .db-nav-item[data-target="' + sel.value + '"]');
    if(b){ marcarActivo(b, false); }
    irAModulo(sel.value);
  });

  /* ---------- Navegación unificada: secciones nuevas + módulos ---------- */
  var bloques = function(){ return ['seccion-tabla','seccion-calendario-full'].map($); };
  function marcarActivo(btn, esNuevo){
    document.querySelectorAll('#navRol .db-nav-item').forEach(function(b){ b.classList.remove('active'); });
    if(!esNuevo){
      document.querySelectorAll('#navRol .sidebar-btn').forEach(function(b){ b.classList.remove('activo'); });
      btn.classList.add('active');
    }
  }
  function mostrarBloque(id){
    bloques().forEach(function(s){ s.style.display = (s.id === id) ? '' : 'none'; });
    document.querySelectorAll('.seccion-dashboard').forEach(function(s){ s.classList.remove('activa'); });
  }
  /* Calendario mensual sencillo (sin dependencias) */
  function pintarCalendario(){
    var h = new Date(), y = h.getFullYear(), m = h.getMonth();
    var primero = (new Date(y, m, 1).getDay() + 6) % 7, dias = new Date(y, m + 1, 0).getDate();
    var nombreMes = h.toLocaleDateString('es-CO', { month:'long', year:'numeric' });
    var html = '<div class="mini-cal-head"><span class="mes">' + esc(nombreMes) + '</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem;">';
    ['L','M','X','J','V','S','D'].forEach(function(d){ html += '<strong style="color:#848c76;font-size:.74rem;">' + d + '</strong>'; });
    for(var i=0;i<primero;i++) html += '<span></span>';
    for(var d=1; d<=dias; d++) html += '<span style="padding:7px 0;border-radius:8px;' + (d === h.getDate() ? 'background:#6b7a3a;color:#fff;font-weight:600;' : '') + '">' + d + '</span>';
    $('miniCalendarioFull').innerHTML = html + '</div>';
  }
  function irAModulo(target){
    if(target === 'calendario-full'){ mostrarBloque('seccion-calendario-full'); pintarCalendario(); return; }
    mostrarBloque('seccion-tabla');
    var cfg = TABLAS.filter(function(t){ return t.endpoint === target; })[0];
    $('tituloTablaGrande').textContent = cfg ? cfg.label : target;
    $('titulo-panel').textContent = cfg ? cfg.label : target;
    sel.value = target;
    cargarTabla(target);
  }
  $('sidebar').addEventListener('click', function(e){
    var btn = e.target.closest('.db-nav-item');
    if(!btn) return;
    if(btn.dataset.target){            // módulo (tabla)
      marcarActivo(btn, false);
      irAModulo(btn.dataset.target);
    }else{                             // sección nueva (cambiarSeccion ya la mostró)
      marcarActivo(btn, true);
      bloques().forEach(function(s){ s.style.display = 'none'; });
    }
    this.classList.remove('abierto');
  });

  /* Al usar las secciones nuevas (menú o accesos rápidos) se oculta la vista de módulos */
  document.addEventListener('DOMContentLoaded', function(){
    if(typeof window.cambiarSeccion !== 'function') return;
    var orig = window.cambiarSeccion;
    window.cambiarSeccion = function(){
      bloques().forEach(function(s){ s.style.display = 'none'; });
      document.querySelectorAll('#navRol .db-nav-item').forEach(function(b){ b.classList.remove('active'); });
      return orig.apply(this, arguments);
    };
  });

  /* El script del rol se escribe aquí para que corra antes de DOMContentLoaded (sus init lo esperan) */
  document.write('<script src="portal-' + rol + '.js"><\/script>');
})();
</script>
</body>
</html>
